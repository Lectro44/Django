{% extends "student_base.html" %}
{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Student Signup</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        {% block content %}
        {% comment %} <link rel="stylesheet" href="{% static 'css/update.css' %}"> {% endcomment %}
        <style>
            h3{
                color:white;
                text-align:center;
            }
            form,h3{
                position:relative;
                padding:5px;
                left:100%;
            }
            
        </style>
    </head>
    <body>
        <h3>Student Profile update</h3>
        <form action="/update_prof/{{ studen.id }}" method="post">
        {% csrf_token %}
        <table align="center" border=3>
            <tr>
                <td><label for = "name">Student name:</label>
                <input type="text" style="margin-left: 80px;"  
                    class="stud" name="sname" value = "{{ studen.name }} "></td><br>
            </tr>
            <tr>
                <td><label for = "name">Student phno:</label>
                <input type="text" style="margin-left: 80px;"  
                    class="stud" name="sphno" required value = "{{ studen.phno }} "></td><br>
            </tr>
            <tr>
                <td><label for = "sbranch">Student branch:</label>
                <select id="sbranch" name="sbranch">
                        <option value="{{ studen.branch }}">{{ studen.branch }}</option>
                    {% for branch in branches %}
                        <option value="{{ branch.sbranch }}">{{ branch.sbranch }}</option>
                    {% endfor %}
                    </select>
                </td><br>
            </tr>
            <tr>
                <td><label for="semester">Student semester:</label>
                    <select id="sem" name="semester">
                        <option value = "{{ studen.semester }}">{{ studen.semester }}</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                    </select></td>
            </tr>
            <tr>
                <td><label for = "password">Password:</label>
                <input type="text"  style="margin-left: 60px;" 
                    class="stud" name="password" value = "{{ studen.password }}"></td>
            </tr>
            
            <tr>
                <td><input type="submit" style="background-color: rgb(153, 0, 255); 
                margin-top: 20px; border-radius: 8px; color: white; margin-left: 50px;" 
                     class="stud" name="update" value="Update Details"></td>
            </tr>
        </table>
    </form>

        
        <script src="" async defer></script>
    </body>
</html>
{% endblock %}
