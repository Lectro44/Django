{% extends "index.html" %}
{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Admin Signup</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        
        {% block content %}
        {% comment %} <link rel="stylesheet" href="{% static 'css/index.css' %}"> {% endcomment %}

    </head>
    <body style = "background-color:black; color:white;">
        <center><h2>Admin registration</h2><center>
        <form action="/regis_admin/" method="post">
        {% csrf_token %}
        <table align="center" border = 3 style="caption-side: bottom; border-collapse: collapse; width: 500px; background-color:crimson; font-weight:bold; color:white;">
            <tr>
                <td><label for = "username">Username:</label>
                <input type="text" style="margin-left: 60px;"  
                    class="stud" name="username" required placeholder="Enter name"></td><br>
            </tr>
            <tr>
                <td><label for = "password">Password:</label>
                <input type="password"  style="margin-left: 60px;" 
                    class="stud" name="password" required placeholder="Enter password"></td>
            </tr>
            <tr>
                <td><label for = "email">Email:</label>
                <input type="email" style="margin-left: 80px;" 
                     class="stud" name="email" required placeholder="Enter email"></td>
            </tr>
            
            <tr>
                <td><input type="submit" style="background-color: rgb(153, 0, 255); 
                margin-top: 20px; border-radius: 8px; color: white; margin-left: 50px;" 
                     class="stud" name="register" value="Register"></td>
            </tr>
        </table>
    </form>
        <script src="" async defer></script>
    </body>
</html>
{% endblock %}
