{% extends "index.html" %}
{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Student Signup</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        {% block content %}
        {% comment %} <link rel="stylesheet" href="{% static 'css/index.css' %}"> {% endcomment %}

    </head>
    <body style = "background-color:orange; color:white;">
        <br>
        <h3 style="margin-right:40px; text-align:center;">Student Registration</h3>
        <form action="/regis_stud/" method="post">
        {% csrf_token %}
        <table align="center" border=3 style="caption-side: bottom; border-collapse: collapse; width: 500px; background-color:black; color:white;">
            <tr>
                <td><label for = "name">Student name:</label>
                <input type="text" style="margin-left: 80px;"  
                    class="stud" name="sname" required placeholder="Enter name"></td>
            </tr>
            <tr>
                <td><label for = "name">Student phno:</label>
                <input type="text" style="margin-left: 80px;"  
                    class="stud" name="sphno" required placeholder="Enter phno"></td><br>
            </tr>
            <tr>
                <td><label for = "sbranch">Student branch:</label>
                <select id="sbranch" name="sbranch">
                    {% for branch in branches %}
                        <option value="{{ branch.sbranch }}">{{ branch.sbranch }}</option>
                    {% endfor %}
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="semester">Student semester:</label>
                    <select style="margin:20px; padding:10px; " id="sem" name="semester">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                    </select></td>
            </tr>
            <tr>
                <td><label for = "password">Password:</label>
                <input type="password"  style="margin-left: 60px;" 
                    class="stud" name="password" required placeholder="Enter password"></td>
            </tr>
            
            <tr>
                <td><input type="submit" style="background-color: rgb(153, 0, 255); 
                margin-top: 20px; border-radius: 8px; color: white; margin-left: 50px;" 
                     class="stud" name="register" value="Register"></td>
            </tr>
        </table>
    </form>

        
        <script src="" async defer></script>
    </body>
</html>
{% endblock %}
