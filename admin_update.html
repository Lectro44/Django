{% extends "admin_base.html" %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Update Book details</title>
    <link rel="stylesheet" href="{% static 'css/update.css' %}">
</head>
<body>
    {% block content %}
    <center><h1>Updation Form</h1></center>
    <form action="/update_stud/{{ bookers.id }}" method="post">
    {% csrf_token %}
    <table align="center">
        <tr>
                <td><label for = "name">Book name:</label>
                <input type="text" class="stud" style="margin-left: 80px; "  
                     name="bkname" value="{{ bookers.name }} "></td><br>
            </tr>
            <tr>
                <td><label for = "auname">Author name:</label>
                <input type="text" class="stud" style="margin-left: 60px; width=200px;" 
                     name="auname" value="{{ bookers.author }}" ></td>
            </tr>
            <tr>
                <td><label for = "bbranch">Student branch:</label>
                <select id="bbranch" name="bbranch">
                    <option class="branching" style="margin-left: 60px; width:200px;" value="{{ bookers.branch }}">{{ bookers.branch }}</option>
                    {% for item in branches %}
                        <option class="branching" style="margin-left: 60px; width:200px;" value="{{ item.sbranch }}">{{ item.sbranch }}</option>
                    {% endfor %}
                    </select>
                </td><br>
                </div>
            </tr>
            
            <tr>
                <td><input type="submit" class="stud" style="background-color: rgb(153, 0, 255); 
                margin-top: 20px; border-radius: 8px; color: white; margin-left: 50px;" 
                      name="book_updt" value="Update"></td>
            </tr>
    </table>
    </form>
</body>
</html>
{% endblock %}
