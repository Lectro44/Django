{% extends "admin_base.html" %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Update Assigned Book details</title>
    <link rel="stylesheet" href="{% static 'css/update.css' %}">
</head>
<body>
    {% block content %}
    <center><h1>Updation Form</h1></center>
    <form action="/updating_stbook/{{ books.id }}" method="post">
    {% csrf_token %}
    <table align="center">
        <tr>
                <td><label for = "name">Student name:</label>
                <input type="text" class="stud" style="margin-left: 80px; "  
                     name="name" value="{{ books.sname }} "></td><br>
            </tr>
            <tr>
                <td><label for = "auname">Book name:</label>
                <input type="text" class="stud" style="margin-left: 60px; width=200px;" 
                     name="bkname" value="{{ books.bname }}" ></td>
            </tr>
            <tr>
                <td><input type="submit" class="stud" style="background-color: rgb(153, 0, 255); 
                margin-top: 20px; border-radius: 8px; color: white; margin-left: 50px;" 
                      name="update" value="Update"></td>
            </tr>
    </table>
    </form>
</body>
</html>
{% endblock %}
