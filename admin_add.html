{% extends "admin_base.html" %}
{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Add books</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        {% block content %}
        {% comment %} <link rel="stylesheet" href="{% static 'css/index.css' %}"> {% endcomment %}

    </head>
    <body>
        <h2 style="text-align:center;">Add new Books here</h2>
        <form action="add_books/" method="post">
        {% csrf_token %}
        <table align="center" width= 3>
            <tr>
                <td><label for = "name">Book name:</label>
                <input type="text" style="margin-left: 80px;"  
                    class="stud" name="bkname" required placeholder="Enter book name"></td><br>
            </tr>
            <tr>
                <td><label for = "auname">Author name:</label>
                <input type="text" style="margin-left: 60px;" 
                    class="stud" name="auname" required placeholder="Enter author name"></td>
            </tr>
            <tr>
                <td><label for = "bbranch">Student branch:</label>
                <select id="bbranch" name="bbranch">
                    {% for branch in branches %}
                        <option value="{{ branch.sbranch }}">{{ branch.sbranch }}</option>
                    {% endfor %}
                    </select>
                </td><br>
            </tr>
            
            <tr>
                <td><input type="submit" style="background-color: rgb(153, 0, 255); 
                margin-top: 20px; border-radius: 8px; color: white; margin-left: 50px;" 
                     class="stud" name="register" value="Add Book"></td>
            </tr>
        </table>
    </form>
        <script src="" async defer></script>
    </body>
</html>
{% endblock %}
