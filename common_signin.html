{% extends "index.html" %}
{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Login page</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        {% block content %}
        {% comment %} <link rel="stylesheet" href="{% static 'css/index.css' %}"> {% endcomment %}

    </head>
    <body style = "background-color:purple; color:white;">
        <h2 style="text-align:center;">Admin/Student Login Page</h2>
        <form action="/user_auth" method="post">
        {% csrf_token %}
        <table align="center" border=3 style="caption-side: bottom; border-collapse: collapse; width: 500px; background-color:black; color:white; height: 200px; ">
            <tr>
                <td><label for = "name">Username:</label>
                <input type="text" style="margin-left: 60px;"  
                    class="stud" name="name" required placeholder="Enter name"></td><br>
            </tr>
            <tr>
                <td><label for = "password">Password:</label>
                <input type="password"  style="margin-left: 60px;" 
                    class="stud" name="password" required placeholder="Enter password"></td>
            </tr>
            
            <tr>
                <td><input type="submit" style="background-color: rgb(153, 0, 255); 
                margin-top: 20px; border-radius: 8px; color: white; margin-left: 50px;" 
                     class="stud" name="register" value="Login"></td>
            </tr>
        </table>
    </form>
        <script src="" async defer></script>
    </body>
</html>
{% endblock %}
